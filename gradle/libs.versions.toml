[versions]
agp = "8.13.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"

# ============================================================
# Compose
# ============================================================
# Safe BOM for compileSdk 35 / AGP 8.13.2
composeBom = "2025.11.00"
activityCompose = "1.9.3"

# ============================================================
# Lifecycle
# ============================================================
lifecycleRuntimeCompose = "2.8.7"
lifecycleRuntimeKtx = "2.8.7"

# ============================================================
# Media3
# ============================================================
media3 = "1.8.0"

# ============================================================
# Navigation & Hilt
# ============================================================
navigationCompose = "2.8.2"
hiltAndroid = "2.52"
hiltNavigationCompose = "1.2.0"

# ============================================================
# Coil & ConstraintLayout
# ============================================================
coilCompose = "2.6.0"
constraintlayoutCompose = "1.1.0"
constraintlayout = "2.2.1"

# ============================================================
# Core AndroidX & UI
# ============================================================
coreSplashscreen = "1.0.1"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.14.0"

# ============================================================
# Network, Serialization & Storage
# ============================================================
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
datastore = "1.1.1"

# ============================================================
# Google Services
# ============================================================
playServicesLocation = "21.3.0"
# Change this from "1.11.0"
coroutinesPlayServices = "1.9.0"

# ============================================================
# Testing
# ============================================================
junit = "4.13.2"
espressoCore = "3.6.1"
junitVersion = "1.2.1"

[libraries]
# ============================================================
# Compose BOM - Controls all sub-library versions safely
# ============================================================
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }

# ============================================================
# Compose Core (Versions managed dynamically by BOM)
# ============================================================
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-foundation-layout = { module = "androidx.compose.foundation:foundation-layout" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Activity Compose (Versioned separately)
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# ============================================================
# Lifecycle
# ============================================================
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }

# ============================================================
# Media3 (ExoPlayer)
# ============================================================
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

# ============================================================
# Navigation & Hilt
# ============================================================
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroid" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hiltAndroid" }

# ============================================================
# Coil & ConstraintLayout
# ============================================================
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
androidx-constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraintlayoutCompose" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

# ============================================================
# Core & UI
# ============================================================
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# ============================================================
# Network & Serialization
# ============================================================
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ============================================================
# Data & Google Services
# ============================================================
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }

# ============================================================
# Testing
# ============================================================
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hiltAndroid" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }